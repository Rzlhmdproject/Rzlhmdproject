<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rzlhmdproject — Smart Review Card Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (Version 9 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- CONTAINER UTAMA -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Background Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- HEADER BRAND -->
        <div class="text-center mb-6 relative z-10">
            <div class="inline-flex p-3.5 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-3 border border-indigo-500/20 shadow-inner">
                <i class="fa-solid fa-qrcode text-3xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Smart Review Card</h1>
            <p id="slot-badge" class="inline-block mt-2 px-3 py-1 bg-slate-800 border border-slate-700 text-indigo-400 text-xs font-mono rounded-full">
                Memeriksa Server Cloud...
            </p>
        </div>

        <!-- STATE 1: REDIRECTING -->
        <div id="section-redirecting" class="text-center py-8 space-y-4 hidden relative z-10">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent"></div>
            <div>
                <h3 class="text-base font-semibold text-white">Mengarahkan ke Halaman Ulasan...</h3>
                <p id="redirect-target-text" class="text-xs text-slate-400 mt-1 truncate max-w-xs mx-auto">Mohon tunggu sebentar...</p>
            </div>
            <button id="manual-redirect-btn" class="text-xs text-indigo-400 underline hover:text-indigo-300 transition-colors hidden">
                Klik di sini jika tidak otomatis dialihkan
            </button>
        </div>

        <!-- STATE 2: FORM AKTIVASI KOSONG -->
        <div id="section-setup" class="space-y-5 hidden relative z-10">
            <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-4 text-xs text-slate-300 leading-relaxed">
                <i class="fa-solid fa-circle-info text-amber-400 mr-1.5"></i>
                <span class="font-semibold text-white">Kartu Belum Didaftarkan:</span> Masukkan nama usaha dan link Google Review Anda di bawah ini untuk mengaktifkan kartu ini secara publik.
            </div>

            <form id="setup-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Nama Bisnis / Usaha</label>
                    <input type="text" id="owner-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-slate-600" placeholder="Contoh: Kedai Kopi Cirebon">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Link Ulasan Google Maps / WhatsApp</label>
                    <input type="url" id="target-url" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors placeholder:text-slate-600" placeholder="https://maps.app.goo.gl/...">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Server Cloud
                </button>
            </form>
        </div>

        <!-- FOOTER -->
        <div class="mt-8 pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-500 relative z-10">
            Powered by <span class="font-bold text-slate-400">Rzlhmdproject Redirection Engine</span>
        </div>
    </div>

    <script>
        // 1. KONFIGURASI FIREBASE CLOUD DATABASE (GRATIS)
        // Ganti kredensial di bawah dari konsol Firebase Anda jika ada
        const firebaseConfig = {
            databaseURL: "https://rzlhmdproject-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        // Inisialisasi Firebase (jika memakai DB publik terbuka)
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        function cleanAndValidateUrl(url) {
            let clean = url.trim();
            if (!clean) return null;
            if (!/^https?:\/\//i.test(clean)) {
                clean = 'https://' + clean;
            }
            try {
                return new URL(clean).href;
            } catch (e) {
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let slotId = urlParams.get('slot') || "SLOT-001";
            slotId = slotId.toUpperCase().replace(/[^A-Z0-9-]/g, '');

            document.getElementById('slot-badge').innerText = slotId;

            // 2. CEK DATA LANGSUNG DARI FIREBASE CLOUD DATABASE
            const slotRef = database.ref('slots/' + slotId);
            
            slotRef.once('value', (snapshot) => {
                const data = snapshot.val();

                // Jika data sudah ada di cloud & aktif -> Redirect
                if (data && data.url && data.status === 'Aktif') {
                    const validUrl = cleanAndValidateUrl(data.url);
                    if (validUrl) {
                        showSection('section-redirecting');
                        document.getElementById('redirect-target-text').innerText = validUrl;
                        
                        setTimeout(() => {
                            window.location.href = validUrl;
                        }, 600);
                        return;
                    }
                }

                // Jika belum diisi di Cloud -> Tampilkan Form Setup
                showSection('section-setup');

                document.getElementById('setup-form').onsubmit = (e) => {
                    e.preventDefault();
                    const owner = document.getElementById('owner-name').value;
                    const rawUrl = document.getElementById('target-url').value;
                    const validatedUrl = cleanAndValidateUrl(rawUrl);

                    if (!validatedUrl) {
                        alert('URL tidak valid!');
                        return;
                    }

                    // SIMPAN DATA KARTU LANGSUNG KE FIREBASE CLOUD (Dapat diakses seluruh dunia)
                    slotRef.set({
                        owner: owner,
                        url: validatedUrl,
                        status: 'Aktif',
                        updatedAt: new Date().toISOString()
                    }).then(() => {
                        alert('Kartu Berhasil Diaktifkan di Cloud!');
                        window.location.href = validatedUrl;
                    }).catch((err) => {
                        alert('Gagal menyimpan ke server: ' + err.message);
                    });
                };
            });
        });

        function showSection(sectionId) {
            document.getElementById('section-redirecting').classList.add('hidden');
            document.getElementById('section-setup').classList.add('hidden');
            document.getElementById(sectionId).classList.remove('hidden');
        }
    </script>
</body>
</html>
