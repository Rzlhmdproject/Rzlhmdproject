<form id="setupForm" onsubmit="handleUserSubmit(event)">
    <div class="form-group">
        <label for="userStoreName">Nama Usaha / Toko</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-store"></i>
            <input type="text" id="userStoreName" placeholder="Contoh: Kopi Kenangan" onkeyup="updatePreview(this.value)" required>
        </div>
    </div>

    <div class="form-group">
        <label for="userUrl">Link Langsung Google Review</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-star"></i>
            <input type="url" id="userUrl" placeholder="https://g.page/r/.../review" required>
        </div>
        
        <!-- Panduan Cara Ambil Link Review Direct -->
        <div class="helper-box">
            💡 <span>Cara Ambil Link Direct Review:</span> Cari toko Anda di Google ➔ Klik menu <b>"Minta Ulasan" (Ask for Reviews)</b> ➔ Salin Tautan Tulis Ulasan.
        </div>
    </div>

    <button type="submit" class="btn-primary">
        <i class="fa-brands fa-whatsapp"></i> Kirim & Aktifkan Link Review
    </button>
</form>
