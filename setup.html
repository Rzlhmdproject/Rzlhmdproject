<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi Kartu — Rzlhmdproject</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface-variant: #f1f3f4;
            --border: #e0e0e0;
            --text-main: #202124;
            --text-sub: #5f6368;
            --g-blue: #1a73e8;
            --g-blue-hover: #1557b0;
            --g-green: #34a853;
            --card-shadow: 0 1px 3px rgba(60,64,67,0.12), 0 1px 2px rgba(60,64,67,0.24);
        }

        [data-theme="dark"] {
            --bg: #171717;
            --surface: #242424;
            --surface-variant: #2d2d2d;
            --border: #3c4043;
            --text-main: #e8eaed;
            --text-sub: #9aa0a6;
            --g-blue: #8ab4f8;
            --g-blue-hover: #aecbfa;
            --g-green: #81c995;
            --card-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.2s, color 0.2s; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 440px; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 32px 24px; box-shadow: var(--card-shadow); text-align: center; position: relative; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .g-dots { display: flex; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .theme-toggle { background: var(--surface-variant); border: 1px solid var(--border); color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .icon-header { width: 64px; height: 64px; background: rgba(26,115,232,0.1); color: var(--g-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; }
        p.subtitle { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-bottom: 20px; }

        .card-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-variant); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--g-blue); margin-bottom: 20px; }

        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 16px; color: var(--text-sub); font-size: 14px; }
        input { width: 100%; padding: 12px 16px 12px 44px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; color: var(--text-main); background: var(--surface); outline: none; }
        input:focus { border-color: var(--g-blue); box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

        button { width: 100%; background: var(--g-blue); color: #fff; border: none; padding: 14px; border-radius: 24px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        button:hover { background: var(--g-blue-hover); }

        .support-box { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-sub); }
        .support-link { color: var(--g-green); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="top-nav">
            <div class="g-dots">
                <div class="dot" style="background:#4285F4"></div>
                <div class="dot" style="background:#EA4335"></div>
                <div class="dot" style="background:#FBBC05"></div>
                <div class="dot" style="background:#34A853"></div>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Ganti Tema">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>

        <div class="icon-header">
            <i class="fa-solid fa-location-dot"></i>
        </div>
        <h2>Aktivasi Kartu Review</h2>
        <p class="subtitle">Hubungkan kartu NFC / QR Code ini dengan lokasi bisnis Google Maps Anda.</p>
        <div class="card-badge" id="cardTagDisplay"><i class="fa-solid fa-id-card"></i> ID Kartu: #001</div>

        <form id="setupForm" onsubmit="handleUserSubmit(event)">
            <div class="form-group">
                <label>Nama Bisnis / Toko Anda</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-store"></i>
                    <input type="text" id="userStoreName" placeholder="Contoh: Ayam Geprek Mentari" required>
                </div>
            </div>

            <div class="form-group">
                <label>Link Google Maps / Google Review Toko</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-link"></i>
                    <input type="url" id="userUrl" placeholder="https://maps.app.goo.gl/..." required>
                </div>
            </div>

            <button type="submit">
                <i class="fa-brands fa-whatsapp"></i> Kirim & Aktifkan Kartu
            </button>
        </form>

        <div class="support-box">
            Butuh bantuan aktivasi?
            <br>
            <a href="https://wa.me/6288971717983?text=Halo%20Admin%20Rzlhmdproject,%20saya%20butuh%20bantuan%20aktivasi%20kartu" target="_blank" class="support-link">
                <i class="fa-brands fa-whatsapp"></i> Hubungi Customer Service
            </a>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const cardId = urlParams.get('id') || '001';

    document.getElementById('cardTagDisplay').innerHTML = `<i class="fa-solid fa-id-card"></i> ID Kartu: #${cardId}`;

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    function handleUserSubmit(e) {
        e.preventDefault();
        const storeName = document.getElementById('userStoreName').value.trim();
        const targetUrl = document.getElementById('userUrl').value.trim();
        const adminWA = "6288971717983"; 

        const message = `Halo Admin Rzlhmdproject! 👋%0A%0ASaya ingin mengaktifkan *Kartu Review ID %23${cardId}*%0A%0A🏪 *Nama Toko:* ${encodeURIComponent(storeName)}%0A📍 *Link Google Maps:* ${encodeURIComponent(targetUrl)}%0A%0AMohon bantuannya untuk diaktifkan di dashboard. Terima kasih!`;

        window.location.href = `https://wa.me/${adminWA}?text=${message}`;
    }
</script>

</body>
</html>
