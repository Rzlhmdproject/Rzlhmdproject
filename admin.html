<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rzlhmdproject — Google Workspace Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            /* Google Light Theme */
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface-variant: #f1f3f4;
            --border: #e0e0e0;
            --text-main: #202124;
            --text-sub: #5f6368;
            --g-blue: #1a73e8;
            --g-blue-hover: #1557b0;
            --g-red: #ea4335;
            --g-green: #34a853;
            --g-yellow: #fbbc04;
            --card-shadow: 0 1px 3px rgba(60,64,67,0.12), 0 1px 2px rgba(60,64,67,0.24);
        }

        [data-theme="dark"] {
            /* Google Dark Theme (Material Dark) */
            --bg: #171717;
            --surface: #242424;
            --surface-variant: #2d2d2d;
            --border: #3c4043;
            --text-main: #e8eaed;
            --text-sub: #9aa0a6;
            --g-blue: #8ab4f8;
            --g-blue-hover: #aecbfa;
            --g-red: #f28b82;
            --g-green: #81c995;
            --g-yellow: #fdd663;
            --card-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 30px 15px; }
        .container { width: 100%; max-width: 650px; }

        /* Top Bar & Theme Toggle */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .brand-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -0.3px; }
        .brand-logo .g-dots { display: flex; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        .theme-toggle { background: var(--surface-variant); border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Material Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: var(--card-shadow); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .card-title i { color: var(--g-blue); }

        /* KPI Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--surface-variant); border-radius: 16px; padding: 14px; text-align: center; }
        .stat-val { font-size: 22px; font-weight: 700; }
        .stat-lbl { font-size: 11px; color: var(--text-sub); font-weight: 600; margin-top: 2px; }

        /* Google Form Style Inputs */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 16px; color: var(--text-sub); font-size: 14px; }
        input { width: 100%; padding: 12px 16px 12px 44px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; color: var(--text-main); background: var(--surface); outline: none; }
        input:focus { border-color: var(--g-blue); box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

        /* Material Buttons */
        .btn-group { display: flex; gap: 10px; margin-top: 18px; }
        button { width: 100%; background: var(--g-blue); color: #fff; border: none; padding: 12px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { background: var(--g-blue-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-danger { background: transparent; color: var(--g-red); border: 1px solid var(--border); }
        .btn-danger:hover { background: rgba(234,67,53,0.08); }

        /* Card List */
        .card-item { padding: 14px 16px; border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; background: var(--surface); }
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px; }
        .badge-active { background: rgba(52,168,83,0.15); color: var(--g-green); }
        .badge-empty { background: rgba(251,188,4,0.15); color: var(--g-yellow); }

        .card-url { color: var(--text-sub); font-size: 12px; word-break: break-all; margin-bottom: 10px; }
        .card-actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
        .action-btn { width: auto; padding: 6px 14px; font-size: 12px; border-radius: 16px; background: var(--surface-variant); color: var(--text-main); border: none; }
        .action-btn:hover { background: var(--border); }

        .toast { padding: 12px 16px; border-radius: 12px; font-size: 13px; display: none; align-items: center; gap: 10px; margin-bottom: 18px; }
        .toast-success { background: rgba(52,168,83,0.15); color: var(--g-green); border: 1px solid var(--g-green); }
        .toast-error { background: rgba(234,67,53,0.15); color: var(--g-red); border: 1px solid var(--g-red); }

        /* Modal QR */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: var(--surface); padding: 24px; border-radius: 24px; text-align: center; max-width: 320px; width: 100%; }
        #qrcode { display: flex; justify-content: center; margin: 16px 0; background: #fff; padding: 12px; border-radius: 12px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand-logo">
            <div class="g-dots">
                <div class="dot" style="background:#4285F4"></div>
                <div class="dot" style="background:#EA4335"></div>
                <div class="dot" style="background:#FBBC05"></div>
                <div class="dot" style="background:#34A853"></div>
            </div>
            Rzlhmdproject Admin
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Ganti Tema Light/Dark">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <div id="toast" class="toast"></div>

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="card">
        <div class="card-title"><i class="fa-solid fa-shield"></i> Login Akses Admin</div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>GitHub Access Token</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="loginToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" required>
                </div>
            </div>
            <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Masuk Dashboard</button>
        </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardSection" class="hidden">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="statTotal">0</div>
                <div class="stat-lbl">Total Kartu</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" style="color:var(--g-green)" id="statActive">0</div>
                <div class="stat-lbl">Aktif</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" style="color:var(--g-yellow)" id="statEmpty">0</div>
                <div class="stat-lbl">Kosong</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-plus-circle"></i> Kelola Slot Kartu</div>
            <form onsubmit="handleSaveCard(event)">
                <div class="form-group">
                    <label>ID Kartu</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="targetCardId" placeholder="Contoh: 001" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Link Google Maps Bisnis</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="url" id="targetUrl" placeholder="Kosongkan jika mau diisi user via setup.html">
                    </div>
                </div>
                <div class="btn-group">
                    <button type="submit" id="saveBtn"><i class="fa-solid fa-check"></i> Simpan Kartu</button>
                    <button type="button" class="btn-danger" onclick="handleDeleteCard()"><i class="fa-solid fa-trash"></i> Reset</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-title" style="justify-content:space-between">
                <span><i class="fa-solid fa-list"></i> Daftar Kartu</span>
                <button onclick="loadDashboardData()" style="width:auto; padding:6px 14px; font-size:12px; background:var(--surface-variant); color:var(--text-main);"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Cari ID Kartu...">
                </div>
            </div>
            <div id="cardsListContainer"></div>
        </div>
    </div>
</div>

<div id="qrModal" class="modal">
    <div class="modal-content">
        <h3 id="qrModalTitle" style="font-size:16px; margin-bottom:4px;">QR Code</h3>
        <p style="font-size:12px; color:var(--text-sub); word-break:break-all;" id="qrModalSubtitle"></p>
        <div id="qrcode"></div>
        <button onclick="closeQrModal()" style="background:var(--surface-variant); color:var(--text-main); margin-top:10px;">Tutup</button>
    </div>
</div>

<script>
    const OWNER = 'rzlhmdproject';
    const REPO = 'rzlhmdproject';
    const PATH = 'vercel.json';
    let globalCardsData = [];

    // Theme Switcher Logic
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        if(theme === 'dark') {
            icon.className = 'fa-solid fa-sun';
        } else {
            icon.className = 'fa-solid fa-moon';
        }
    }

    // Init Theme
    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);

    document.addEventListener("DOMContentLoaded", () => {
        updateThemeIcon(savedTheme);
        const savedToken = localStorage.getItem("rzl_gh_token");
        if (savedToken) {
            document.getElementById("loginToken").value = savedToken;
            verifyAndOpenDashboard(savedToken);
        }
    });

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.className = `toast toast-${type}`;
        t.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'circle-check' : 'circle-xmark'}"></i> ${msg}`;
        t.style.display = 'flex';
        setTimeout(() => t.style.display = 'none', 4000);
    }

    async function handleLogin(e) {
        e.preventDefault();
        const token = document.getElementById('loginToken').value.trim();
        await verifyAndOpenDashboard(token, true);
    }

    async function verifyAndOpenDashboard(token, notify = false) {
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!res.ok) throw new Error('Token salah.');
            localStorage.setItem("rzl_gh_token", token);
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            if (notify) showToast('Login Berhasil');
            loadDashboardData();
        } catch (err) {
            localStorage.removeItem("rzl_gh_token");
            if (notify) showToast(err.message, 'error');
        }
    }

    async function loadDashboardData() {
        const token = localStorage.getItem("rzl_gh_token");
        const container = document.getElementById('cardsListContainer');
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const fileData = await res.json();
            const jsonContent = JSON.parse(atob(fileData.content));
            globalCardsData = jsonContent.redirects.filter(r => r.source && r.source.startsWith('/card/'));
            updateKPIs(globalCardsData);
            renderCards(globalCardsData);
        } catch (e) {
            container.innerHTML = `<p style="font-size: 13px; color: var(--g-red); text-align: center;">Gagal memuat data.</p>`;
        }
    }

    function updateKPIs(cards) {
        const total = cards.length;
        const active = cards.filter(c => !c.destination.includes('setup.html')).length;
        document.getElementById('statTotal').innerText = total;
        document.getElementById('statActive').innerText = active;
        document.getElementById('statEmpty').innerText = total - active;
    }

    function renderCards(cards) {
        const container = document.getElementById('cardsListContainer');
        if (cards.length === 0) {
            container.innerHTML = `<p style="font-size: 13px; color: var(--text-sub); text-align: center;">Belum ada kartu.</p>`;
            return;
        }

        container.innerHTML = cards.map(item => {
            const cardId = item.source.replace('/card/', '');
            const fullAccessUrl = `https://rzlhmdproject.vercel.app${item.source}`;
            const isSetup = item.destination.includes('setup.html');

            return `
                <div class="card-item">
                    <div class="card-header-row">
                        <span style="font-weight:700;">ID Kartu #${cardId}</span>
                        <span class="card-badge ${isSetup ? 'badge-empty' : 'badge-active'}">
                            ${isSetup ? 'KOSONG' : 'AKTIF'}
                        </span>
                    </div>
                    <div class="card-url">${item.destination}</div>
                    <div class="card-actions">
                        <button onclick="copyNfcLink('${fullAccessUrl}')" class="action-btn"><i class="fa-solid fa-copy"></i> Copy Link</button>
                        <button onclick="showQrModal('${cardId}', '${fullAccessUrl}')" class="action-btn"><i class="fa-solid fa-qrcode"></i> QR</button>
                        <button onclick="selectCardToEdit('${cardId}', '${item.destination}')" class="action-btn"><i class="fa-solid fa-pen"></i> Edit</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        renderCards(globalCardsData.filter(item => item.source.replace('/card/', '').toLowerCase().includes(query)));
    }

    function copyNfcLink(url) {
        navigator.clipboard.writeText(url).then(() => showToast('Link NFC Tersalin!'));
    }

    function showQrModal(id, url) {
        document.getElementById('qrModalTitle').innerText = `QR Code #${id}`;
        document.getElementById('qrModalSubtitle').innerText = url;
        const qr = document.getElementById('qrcode');
        qr.innerHTML = '';
        new QRCode(qr, { text: url, width: 160, height: 160 });
        document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQrModal() { document.getElementById('qrModal').style.display = 'none'; }

    function selectCardToEdit(id, url) {
        document.getElementById('targetCardId').value = id;
        document.getElementById('targetUrl').value = url.includes('setup.html') ? '' : url;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function handleSaveCard(e) {
        e.preventDefault();
        const token = localStorage.getItem("rzl_gh_token");
        const cardId = document.getElementById('targetCardId').value.trim();
        let targetUrl = document.getElementById('targetUrl').value.trim() || `https://rzlhmdproject.vercel.app/setup.html?id=${cardId}`;
        const btn = document.getElementById('saveBtn');

        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

        try {
            const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
            const res = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
            const fileData = await res.json();
            let jsonContent = JSON.parse(atob(fileData.content));

            const sourcePath = `/card/${cardId}`;
            let found = false;

            jsonContent.redirects = jsonContent.redirects.map(i => ({ source: i.source, destination: i.destination, permanent: false }));
            jsonContent.redirects.forEach(i => { if (i.source === sourcePath) { i.destination = targetUrl; found = true; } });
            if (!found) jsonContent.redirects.push({ source: sourcePath, destination: targetUrl, permanent: false });

            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update /card/${cardId}`, content: btoa(JSON.stringify(jsonContent, null, 2)), sha: fileData.sha })
            });

            if (!putRes.ok) throw new Error('Gagal menyimpan.');

            showToast(`Kartu #${cardId} Berhasil Disimpan!`);
            document.getElementById('targetCardId').value = '';
            document.getElementById('targetUrl').value = '';
            loadDashboardData();
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Simpan Kartu`;
        }
    }

    async function handleDeleteCard() {
        const token = localStorage.getItem("rzl_gh_token");
        const cardId = document.getElementById('targetCardId').value.trim();
        if (!cardId || !confirm(`Reset Kartu #${cardId}?`)) return;

        try {
            const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
            const res = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
            const fileData = await res.json();
            let jsonContent = JSON.parse(atob(fileData.content));

            jsonContent.redirects = jsonContent.redirects.filter(i => i.source !== `/card/${cardId}`).map(i => ({ source: i.source, destination: i.destination, permanent: false }));

            await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Delete /card/${cardId}`, content: btoa(JSON.stringify(jsonContent, null, 2)), sha: fileData.sha })
            });

            showToast(`Kartu #${cardId} Direset`);
            document.getElementById('targetCardId').value = '';
            document.getElementById('targetUrl').value = '';
            loadDashboardData();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }
</script>
</body>
</html>
