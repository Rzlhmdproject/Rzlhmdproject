<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rzlhmdproject — Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --bg-main: #141518;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --panel-card: rgba(255, 255, 255, 0.07);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-white: #ffffff;
            --text-muted: #9a9fa8;
            --accent-lime: #d9f99d;
            --accent-orange: #ff7a00;
            --accent-blue: #5865f2;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-white); min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
        .app-layout { display: flex; width: 100%; max-width: 1100px; background: rgba(30, 31, 36, 0.6); border-radius: 28px; border: 1px solid var(--panel-border); backdrop-filter: blur(20px); overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }

        /* Sidebar Navigation */
        .sidebar { width: 70px; background: rgba(0, 0, 0, 0.2); border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 24px 0; }
        .nav-logo { width: 40px; height: 40px; background: #fff; color: #000; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; }
        .nav-menu { display: flex; flex-direction: column; gap: 18px; }
        .nav-icon { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 16px; transition: all 0.2s; }
        .nav-icon:hover, .nav-icon.active { background: var(--panel-card); color: #fff; border: 1px solid var(--panel-border); }

        /* Main Content */
        .main-content { flex: 1; padding: 28px; overflow-y: auto; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .top-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

        /* Banner Card Component */
        .hero-banner { background: linear-gradient(135deg, rgba(88, 101, 242, 0.2) 0%, rgba(255, 122, 0, 0.1) 100%), var(--panel-card); border: 1px solid var(--panel-border); border-radius: 24px; padding: 24px; margin-bottom: 20px; position: relative; }
        .hero-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
        .hero-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        /* Floating Stats Bar */
        .glass-stats-bar { display: flex; gap: 16px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 14px 20px; }
        .stat-item { flex: 1; border-right: 1px solid rgba(255, 255, 255, 0.1); padding-right: 12px; }
        .stat-item:last-child { border-right: none; }
        .stat-number { font-size: 20px; font-weight: 800; color: #fff; }
        .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

        /* Form Card */
        .panel-card { background: var(--panel-card); border: 1px solid var(--panel-border); border-radius: 22px; padding: 20px; margin-bottom: 20px; }
        .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px 16px; border: 1px solid var(--panel-border); border-radius: 14px; background: rgba(0, 0, 0, 0.2); color: #fff; font-size: 13px; outline: none; }
        input:focus { border-color: var(--accent-lime); }

        /* Action Buttons */
        .btn-group { display: flex; gap: 10px; margin-top: 16px; }
        button { width: 100%; padding: 12px; border-radius: 14px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--accent-lime); color: #141518; transition: all 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Card Row Table */
        .card-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--panel-border); border-radius: 16px; padding: 14px 18px; margin-bottom: 10px; }
        .card-id { font-weight: 700; font-size: 14px; }
        .card-dest { font-size: 12px; color: var(--text-muted); word-break: break-all; margin-top: 2px; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .badge-active { background: rgba(217, 249, 157, 0.15); color: var(--accent-lime); border: 1px solid rgba(217, 249, 157, 0.3); }
        .badge-empty { background: rgba(255, 122, 0, 0.15); color: var(--accent-orange); border: 1px solid rgba(255, 122, 0, 0.3); }

        .btn-action { width: auto; padding: 6px 12px; font-size: 11px; background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--panel-border); border-radius: 10px; }
        
        .toast { padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 600; display: none; text-align: center; margin-bottom: 16px; }
        .toast-ok { background: rgba(217, 249, 157, 0.2); color: var(--accent-lime); border: 1px solid var(--accent-lime); }
        .toast-err { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .hidden { display: none !important; }

        /* Modal QR */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 99; }
        .modal-box { background: #1c1d21; border: 1px solid var(--panel-border); padding: 24px; border-radius: 24px; text-align: center; max-width: 320px; width: 100%; }
        #qrcode { display: flex; justify-content: center; background: #fff; padding: 12px; border-radius: 16px; margin: 16px 0; }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="nav-logo"><i class="fa-solid fa-bolt"></i></div>
        <div class="nav-menu">
            <a href="#" class="nav-icon active"><i class="fa-solid fa-chart-pie"></i></a>
            <a href="#" class="nav-icon"><i class="fa-solid fa-credit-card"></i></a>
            <a href="#" class="nav-icon"><i class="fa-solid fa-gear"></i></a>
        </div>
        <a href="#" onclick="handleLogout()" class="nav-icon"><i class="fa-solid fa-power-off" style="color:var(--danger)"></i></a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-header">
            <h1>Analytics Control</h1>
            <div style="font-size: 12px; color: var(--text-muted);">Rzlhmdproject Admin</div>
        </div>

        <div id="toast" class="toast"></div>

        <!-- Login Card -->
        <div id="loginCard" class="panel-card">
            <div class="panel-title"><i class="fa-solid fa-lock"></i> Autentikasi Admin</div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>GitHub Personal Token</label>
                    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" required>
                </div>
                <button type="submit">Masuk Dashboard</button>
            </form>
        </div>

        <!-- Dashboard Content -->
        <div id="dashCard" class="hidden">
            <!-- Hero Banner & Stats -->
            <div class="hero-banner">
                <div class="hero-title">Optimize Your Cards</div>
                <div class="hero-sub">Kelola alur aktivasi dan pengalihan link NFC secara instant.</div>
                
                <div class="glass-stats-bar">
                    <div class="stat-item">
                        <div class="stat-number" id="sTotal">0</div>
                        <div class="stat-label">Total Slot</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" style="color:var(--accent-lime)" id="sActive">0</div>
                        <div class="stat-label">Kartu Aktif</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" style="color:var(--accent-orange)" id="sEmpty">0</div>
                        <div class="stat-label">Belum Aktif</div>
                    </div>
                </div>
            </div>

            <!-- Form Card Manager -->
            <div class="panel-card">
                <div class="panel-title"><i class="fa-solid fa-sliders"></i> Kelola Slot Kartu</div>
                <form onsubmit="handleSave(event)">
                    <div class="form-group">
                        <label>ID Kartu</label>
                        <input type="text" id="cardId" placeholder="Contoh: 001" required>
                    </div>
                    <div class="form-group">
                        <label>Link Google Maps Bisnis</label>
                        <input type="url" id="cardUrl" placeholder="Kosongkan jika diisi klien via setup.html">
                    </div>
                    <div class="btn-group">
                        <button type="submit" id="saveBtn"><i class="fa-solid fa-check"></i> Simpan Slot</button>
                        <button type="button" class="btn-danger" onclick="handleDelete()"><i class="fa-solid fa-trash"></i> Reset</button>
                    </div>
                </form>
            </div>

            <!-- List Card Table -->
            <div class="panel-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                    <div class="panel-title" style="margin:0;"><i class="fa-solid fa-list"></i> Daftar Slot Kartu</div>
                    <button class="btn-action" onclick="loadData()"><i class="fa-solid fa-rotate"></i> Refresh</button>
                </div>
                <div id="cardList"></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal QR -->
<div id="qrModal" class="modal">
    <div class="modal-box">
        <h3 id="qrModalTitle" style="font-size:16px;">QR Code</h3>
        <p id="qrModalSubtitle" style="font-size:11px; color:var(--text-muted); word-break:break-all;"></p>
        <div id="qrcode"></div>
        <button class="btn-action" style="width:100%;" onclick="closeQrModal()">Tutup</button>
    </div>
</div>

<script>
    const OWNER = 'rzlhmdproject', REPO = 'rzlhmdproject', PATH = 'vercel.json';
    let rawData = [];

    function notify(msg, err = false) {
        const t = document.getElementById('toast');
        t.className = `toast ${err ? 'toast-err' : 'toast-ok'}`;
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const tok = localStorage.getItem("rzl_tok");
        if(tok) { document.getElementById("token").value = tok; verify(tok); }
    });

    async function handleLogin(e) {
        e.preventDefault();
        verify(document.getElementById('token').value.trim(), true);
    }

    async function verify(tok, showToast = false) {
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, { headers: { 'Authorization': `token ${tok}` } });
            if (!res.ok) throw new Error('Token Salah');
            localStorage.setItem("rzl_tok", tok);
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('dashCard').classList.remove('hidden');
            if(showToast) notify('Login Berhasil');
            loadData();
        } catch(e) {
            localStorage.removeItem("rzl_tok");
            if(showToast) notify(e.message, true);
        }
    }

    function handleLogout() {
        localStorage.removeItem("rzl_tok");
        location.reload();
    }

    async function loadData() {
        const tok = localStorage.getItem("rzl_tok");
        try {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, { headers: { 'Authorization': `token ${tok}` } });
            const data = await res.json();
            const json = JSON.parse(atob(data.content));
            rawData = json.redirects.filter(r => r.source && r.source.startsWith('/card/'));
            
            const total = rawData.length;
            const active = rawData.filter(r => !r.destination.includes('setup.html')).length;
            document.getElementById('sTotal').innerText = total;
            document.getElementById('sActive').innerText = active;
            document.getElementById('sEmpty').innerText = total - active;

            const list = document.getElementById('cardList');
            if(total === 0) { list.innerHTML = '<p style="text-align:center;color:var(--text-muted)">Belum ada slot.</p>'; return; }
            
            list.innerHTML = rawData.map(item => {
                const id = item.source.replace('/card/', '');
                const isSetup = item.destination.includes('setup.html');
                const fullUrl = `https://rzlhmdproject.vercel.app${item.source}`;
                return `
                    <div class="card-row">
                        <div>
                            <div class="card-id">Slot ID #${id}</div>
                            <div class="card-dest">${item.destination}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="badge ${isSetup ? 'badge-empty' : 'badge-active'}">${isSetup ? 'KOSONG' : 'AKTIF'}</span>
                            <button class="btn-action" onclick="navigator.clipboard.writeText('${fullUrl}'); notify('Copied!');"><i class="fa-solid fa-copy"></i></button>
                            <button class="btn-action" onclick="showQrModal('${id}', '${fullAccessUrl || fullUrl}')"><i class="fa-solid fa-qrcode"></i></button>
                            <button class="btn-action" onclick="editCard('${id}', '${item.destination}')"><i class="fa-solid fa-pen"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        } catch(e) { notify('Gagal memuat data', true); }
    }

    function showQrModal(id, url) {
        document.getElementById('qrModalTitle').innerText = `QR Code #${id}`;
        document.getElementById('qrModalSubtitle').innerText = url;
        const qr = document.getElementById('qrcode');
        qr.innerHTML = '';
        new QRCode(qr, { text: url, width: 160, height: 160 });
        document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQrModal() { document.getElementById('qrModal').style.display = 'none'; }

    function editCard(id, url) {
        document.getElementById('cardId').value = id;
        document.getElementById('cardUrl').value = url.includes('setup.html') ? '' : url;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function handleSave(e) {
        e.preventDefault();
        const tok = localStorage.getItem("rzl_tok");
        const id = document.getElementById('cardId').value.trim();
        const url = document.getElementById('cardUrl').value.trim() || `https://rzlhmdproject.vercel.app/setup.html?id=${id}`;
        const btn = document.getElementById('saveBtn');

        btn.disabled = true;
        btn.innerText = "Saving...";

        try {
            const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, { headers: { 'Authorization': `token ${tok}` } });
            const fileData = await getRes.json();
            let json = JSON.parse(atob(fileData.content));

            const src = `/card/${id}`;
            let found = false;
            json.redirects = json.redirects.map(i => ({ source: i.source, destination: i.destination, permanent: false }));
            json.redirects.forEach(i => { if(i.source === src) { i.destination = url; found = true; } });
            if(!found) json.redirects.push({ source: src, destination: url, permanent: false });

            await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${tok}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update /card/${id}`, content: btoa(JSON.stringify(json, null, 2)), sha: fileData.sha })
            });

            notify(`Kartu #${id} Tersimpan!`);
            document.getElementById('cardId').value = '';
            document.getElementById('cardUrl').value = '';
            loadData();
        } catch(e) { notify(e.message, true); }
        finally { btn.disabled = false; btn.innerText = "Simpan Slot"; }
    }

    async function handleDelete() {
        const tok = localStorage.getItem("rzl_tok");
        const id = document.getElementById('cardId').value.trim();
        if(!id || !confirm(`Reset Slot #${id}?`)) return;

        try {
            const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, { headers: { 'Authorization': `token ${tok}` } });
            const fileData = await getRes.json();
            let json = JSON.parse(atob(fileData.content));

            json.redirects = json.redirects.filter(i => i.source !== `/card/${id}`).map(i => ({ source: i.source, destination: i.destination, permanent: false }));

            await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${tok}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Delete /card/${id}`, content: btoa(JSON.stringify(json, null, 2)), sha: fileData.sha })
            });

            notify(`Slot #${id} Direset!`);
            document.getElementById('cardId').value = '';
            document.getElementById('cardUrl').value = '';
            loadData();
        } catch(e) { notify(e.message, true); }
    }
</script>
</body>
</html>
