<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rzlhmdproject — Smart Review Dashboard</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Header Brand */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eff6ff;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid #dbeafe;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        /* Card Container */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 28px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .card-title i {
            color: var(--primary);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            background: #fff;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .helper-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Submit Button & Animations */
        button {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Live Redirect List Table */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .card-badge {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .card-url {
            font-size: 12px;
            color: var(--text-muted);
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            max-width: 320px;
        }

        /* Toast Message Notification */
        .toast {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        .toast-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .toast-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="brand-badge">
            <i class="fa-solid fa-bolt"></i> Rzlhmdproject System
        </div>
        <h1>Smart Review Dashboard</h1>
        <p>Kelola link Google Review kartu NFC & QR Code secara instan</p>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <!-- Form Section -->
    <div class="card">
        <div class="card-title">
            <i class="fa-solid fa-pen-to-square"></i> Input / Perbarui Target Kartu
        </div>

        <form id="redirectForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="ghToken">GitHub Personal Access Token</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" required>
                </div>
                <div class="helper-text">*Token disimpan otomatis di browser HP/Laptop Anda.</div>
            </div>

            <div class="form-group">
                <label for="cardId">Nomor Kartu (ID)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="cardId" placeholder="Contoh: 001" required>
                </div>
            </div>

            <div class="form-group">
                <label for="targetUrl">Link Google Review / Maps Klien</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="url" id="targetUrl" placeholder="https://maps.app.goo.gl/..." required>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                <i class="fa-solid fa-floppy-disk"></i> Simpan & Update Link
            </button>
        </form>
    </div>

    <!-- Live Active Cards List -->
    <div class="card">
        <div class="list-header">
            <div class="card-title" style="border-bottom: none; padding-bottom: 0; margin-bottom: 0;">
                <i class="fa-solid fa-list-check"></i> Daftar Kartu Terdaftar
            </div>
            <button onclick="loadCurrentRedirects()" style="width: auto; padding: 6px 12px; font-size: 12px; background: #f1f5f9; color: var(--text-main); box-shadow: none;">
                <i class="fa-solid fa-rotate-right"></i> Refresh Data
            </button>
        </div>
        <div id="cardsContainer" style="margin-top: 16px;">
            <p style="font-size: 13px; color: var(--text-muted); text-align: center;">Masukkan Token di atas & klik Refresh Data untuk melihat daftar kartu.</p>
        </div>
    </div>
</div>

<script>
    const OWNER = 'rzlhmdproject';
    const REPO = 'rzlhmdproject';
    const PATH = 'vercel.json';

    // Otomatis muat Token yang tersimpan di LocalStorage saat halaman dibuka
    document.addEventListener("DOMContentLoaded", () => {
        const savedToken = localStorage.getItem("rzl_gh_token");
        if (savedToken) {
            document.getElementById("ghToken").value = savedToken;
            loadCurrentRedirects();
        }
    });

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = type === 'success' 
            ? `<i class="fa-solid fa-circle-check"></i> ${message}` 
            : `<i class="fa-solid fa-circle-xmark"></i> ${message}`;
        toast.style.display = 'flex';
        setTimeout(() => { toast.style.display = 'none'; }, 5000);
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        
        const token = document.getElementById('ghToken').value.trim();
        const cardIdInput = document.getElementById('cardId').value.trim();
        const cardId = cardIdInput ? cardIdInput : '001';
        const targetUrl = document.getElementById('targetUrl').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        // Simpan token ke browser
        localStorage.setItem("rzl_gh_token", token);

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses ke GitHub...`;

        try {
            const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
            
            // 1. Ambil data vercel.json saat ini
            const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
            if (!getRes.ok) throw new Error('Token salah atau gagal terhubung ke GitHub.');
            
            const fileData = await getRes.json();
            let jsonContent = JSON.parse(atob(fileData.content));
            
            const sourcePath = `/card/${cardId}`;
            let updated = false;

            // 2. Cek & update jika kartu sudah ada
            jsonContent.redirects.forEach(item => {
                if (item.source === sourcePath) {
                    item.destination = targetUrl;
                    updated = true;
                }
            });

            // 3. Tambahkan jika kartu baru
            if (!updated) {
                jsonContent.redirects.push({
                    source: sourcePath,
                    destination: targetUrl,
                    permanent: false
                });
            }

            // 4. Push balik ke GitHub
            const updatedContent = btoa(JSON.stringify(jsonContent, null, 2));
            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: `Update card /card/${cardId} via Rzlhmdproject Dashboard`,
                    content: updatedContent,
                    sha: fileData.sha
                })
            });

            if (!putRes.ok) throw new Error('Gagal menyimpan perubahan ke GitHub.');

            showToast(`Kartu ID ${cardId} berhasil dihubungkan ke link baru!`);
            document.getElementById('cardId').value = '';
            document.getElementById('targetUrl').value = '';
            
            // Re-load list
            setTimeout(loadCurrentRedirects, 1000);

        } catch (error) {
            showToast(error.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Simpan & Update Link`;
        }
    }

    async function loadCurrentRedirects() {
        const token = document.getElementById('ghToken').value.trim();
        const container = document.getElementById('cardsContainer');

        if (!token) {
            container.innerHTML = `<p style="font-size: 13px; color: var(--text-muted); text-align: center;">Isi Token untuk melihat data.</p>`;
            return;
        }

        try {
            const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
            const res = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
            if (!res.ok) return;

            const fileData = await res.json();
            const jsonContent = JSON.parse(atob(fileData.content));

            const cardRedirects = jsonContent.redirects.filter(r => r.source.startsWith('/card/'));

            if (cardRedirects.length === 0) {
                container.innerHTML = `<p style="font-size: 13px; color: var(--text-muted); text-align: center;">Belum ada kartu terdaftar.</p>`;
                return;
            }

            container.innerHTML = cardRedirects.map(item => `
                <div class="card-item">
                    <div class="card-info">
                        <span class="card-badge">${item.source.replace('/card/', 'ID ')}</span>
                        <span class="card-url" title="${item.destination}">${item.destination}</span>
                    </div>
                    <a href="${item.destination}" target="_blank" style="color: var(--primary); font-size: 13px;"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                </div>
            `).join('');

        } catch (err) {
            container.innerHTML = `<p style="font-size: 13px; color: var(--danger); text-align: center;">Gagal memuat daftar kartu.</p>`;
        }
    }
</script>

</body>
</html>
